service: greenbyte-auth-api

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  environment:
    PROJECT_SLUG: greenbyte

functions:
  authenticate:
    handler: functions/authenticate/handler.handler
    events:
      - httpApi:
          method: POST
          path: /api/authentications
