service: greenbyte-core-api

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  environment:
    PROJECT_SLUG: greenbyte
    DEMO_PLANT_TABLE_NAME: greenbyte-${sls:stage}-demo-plant-state
    # Optional — when set, BFF forwards to Camilo/David instead of in-Lambda stubs
    DATA_API_BASE_URL: ${env:DATA_API_BASE_URL, ''}
    AGENT_API_BASE_URL: ${env:AGENT_API_BASE_URL, ''}
  httpApi:
    cors:
      allowedOrigins:
        - https://greenbyte-ag.com
        - https://www.greenbyte-ag.com
        - http://localhost:5173
        - http://localhost:51730
        - http://localhost:51731
      allowedHeaders:
        - Content-Type
        - x-program-id
      allowedMethods:
        - GET
        - POST
        - OPTIONS
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/greenbyte-${sls:stage}-demo-plant-state

functions:
  health:
    handler: functions/health/handler.handler
    events:
      - httpApi:
          method: GET
          path: /api/core/health

  plantDemoQueue:
    handler: functions/plant-demo-queue/handler.handler
    environment:
      # Direct connection to public RDS. Empty values keep the Dynamo baseline.
      # Set these in the deploy shell; do not commit the password.
      DATABASE_URL: ${env:DATABASE_URL, ''}
      PGHOST: ${env:PGHOST, ''}
      PGPORT: ${env:PGPORT, '5432'}
      PGDATABASE: ${env:PGDATABASE, 'greenbyte'}
      PGUSER: ${env:PGUSER, ''}
      PGPASSWORD: ${env:PGPASSWORD, ''}
      PGSSL: ${env:PGSSL, 'require'}
    events:
      - httpApi:
          method: GET
          path: /demo/plant/lines/{lineId}/queue

  plantDemoEvents:
    handler: functions/plant-demo-events/handler.handler
    events:
      - httpApi:
          method: POST
          path: /demo/plant/events

  plantDemoIngestPassFail:
    handler: functions/plant-demo-ingest-pass-fail/handler.handler
    environment:
      DATABASE_URL: ${env:DATABASE_URL, ''}
      PGHOST: ${env:PGHOST, ''}
      PGPORT: ${env:PGPORT, '5432'}
      PGDATABASE: ${env:PGDATABASE, 'greenbyte'}
      PGUSER: ${env:PGUSER, ''}
      PGPASSWORD: ${env:PGPASSWORD, ''}
      PGSSL: ${env:PGSSL, 'require'}
    events:
      - httpApi:
          method: POST
          path: /demo/plant/ingest/pass-fail-log

  plantDemoIngestSap:
    handler: functions/plant-demo-ingest-sap/handler.handler
    environment:
      DATABASE_URL: ${env:DATABASE_URL, ''}
      PGHOST: ${env:PGHOST, ''}
      PGPORT: ${env:PGPORT, '5432'}
      PGDATABASE: ${env:PGDATABASE, 'greenbyte'}
      PGUSER: ${env:PGUSER, ''}
      PGPASSWORD: ${env:PGPASSWORD, ''}
      PGSSL: ${env:PGSSL, 'require'}
    events:
      - httpApi:
          method: POST
          path: /demo/plant/ingest/sap-priority-change

  plantDemoIngestSapRefresh:
    handler: functions/plant-demo-ingest-sap-refresh/handler.handler
    environment:
      DATABASE_URL: ${env:DATABASE_URL, ''}
      PGHOST: ${env:PGHOST, ''}
      PGPORT: ${env:PGPORT, '5432'}
      PGDATABASE: ${env:PGDATABASE, 'greenbyte'}
      PGUSER: ${env:PGUSER, ''}
      PGPASSWORD: ${env:PGPASSWORD, ''}
      PGSSL: ${env:PGSSL, 'require'}
    events:
      - httpApi:
          method: POST
          path: /demo/plant/ingest/sap-queue-refresh

  plantDemoReset:
    handler: functions/plant-demo-reset/handler.handler
    events:
      - httpApi:
          method: POST
          path: /demo/plant/reset

  plantDemoAccept:
    handler: functions/plant-demo-accept/handler.handler
    environment:
      DATABASE_URL: ${env:DATABASE_URL, ''}
      PGHOST: ${env:PGHOST, ''}
      PGPORT: ${env:PGPORT, '5432'}
      PGDATABASE: ${env:PGDATABASE, 'greenbyte'}
      PGUSER: ${env:PGUSER, ''}
      PGPASSWORD: ${env:PGPASSWORD, ''}
      PGSSL: ${env:PGSSL, 'require'}
    events:
      - httpApi:
          method: POST
          path: /demo/plant/schedule/accept

  plantDemoExplain:
    handler: functions/plant-demo-explain/handler.handler
    events:
      - httpApi:
          method: POST
          path: /demo/plant/batches/explain
